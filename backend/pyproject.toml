[project]
name = "server"
version = "1.0.0"
description = "FastAPI backend service for streaming Azure Foundry GPT-6 Astra and GPT-5.6 Sol responses."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.141.1",
  "limits>=5.8.0",
  "loguru>=0.7.3",
  "openai>=3.19.2",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
  "add-trailing-comma>=4.0.0",
  "coverage>=7.16.1",
  "deptry>=0.25.1",
  "httpx2>=2.13.1",
  "hypothesis>=6.168.1",
  "inline-snapshot[black]>=0.35.4",
  "locust>=2.46.6",
  "prek>=0.5.3",
  "pyrefly>=1.3.1",
  "pytest-env>=1.7.1",
  "pytest-random-order>=1.2.0",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
  # Match the frozen ty-pre-commit hook in ../prek.toml.
  "ty==0.0.84",
]

[tool.uv]
required-version = "==0.12.18"

[tool.uv.audit]
ignore = []

[tool.deptry.per_rule_ignores]
DEP004 = ["locust"]

[tool.ruff]
fix = true
preview = true
unsafe-fixes = true
extend-include = ["*.md"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = ["missing-trailing-comma", "CPY", "D", "DOC"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-branches = 6
max-returns = 3
max-statements = 20

[tool.ruff.lint.per-file-ignores]
"app/main.py" = [
  # slowapi requires the endpoint parameter named `request`; it never appears in the body
  "unused-function-argument",
]
"locustfile.py" = [
  # load-test input selection is not security-sensitive
  "suspicious-non-cryptographic-random-usage",
]
"test_*.py" = [
  # autouse fixtures are intentional for test isolation
  "pytest-fixture-autouse",
  # tests can have asserts
  "assert",
  # magic values in assertions are fine
  "magic-value-comparison",
  # parametrized tests naturally have many arguments
  "too-many-arguments",
  "too-many-positional-arguments",
  # fixtures used for side effects don't need to be referenced
  "unused-function-argument",
  # `== ""` assertions are intentionally explicit
  "compare-to-empty-string",
  # long expected-value strings in parametrize are unavoidable
  "line-too-long",
]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ty.src]
exclude = [".venv", "build", "dist"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Enable every current diagnostic, including soundness and suppression checks that
# ty leaves disabled by default. Pinning ty in uv.lock keeps new rules from arriving
# silently between dependency updates.
all = "error"

[tool.ty.analysis]
# Prefer sound narrowing over convenience assumptions at external-data boundaries.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
addopts = [
  # error on problems parsing pytest configuration
  "--strict-config",
  # error on using unregistered marker
  "--strict-markers",
  # show extra test summary info for everything
  "-ra",
  # include more verbose output
  "--verbose",
  # using pytest-random-order plugin option
  "--random-order",
]
testpaths = ["tests"]
# pytest-env sets TESTING before any app module is imported, so Settings() does
# not reject missing Azure credentials during collection. The `D:` (default)
# prefix only sets it when absent, mirroring os.environ.setdefault.
env = ["D:TESTING=true"]
xfail_strict = true
filterwarnings = [
  "error",
  # slowapi 0.1.10 calls asyncio.iscoroutinefunction, deprecated in Python 3.14
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
  # inline-snapshot reports unfixable snapshots via plain Warning subclasses,
  # which "error" would turn into failures instead of advisory messages.
  "default::inline_snapshot.syntax_warnings.InlineSnapshotInfo",
  "default::inline_snapshot.syntax_warnings.InlineSnapshotSyntaxWarning",
]
python_files = ["test_*.py", "test-*.py", "tests.py", "test.py"]
