[global]
respect-gitignore = true
# Preserve the upstream bytes recorded by the agent-browser skill lock.
exclude = [".agents/skills/agent-browser/SKILL.md"]
force-exclude = true

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD013]
code_blocks = false
tables = false
headings = true

[MD024]
allow_different_nesting = true

[MD029]
style = "ordered"

[MD035]
style = "---"

[MD044]
names = ["CommonMark", "JavaScript", "Markdown", "Node.js"]
code_blocks = false

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD049]
style = "asterisk"

[MD050]
style = "asterisk"

[MD060]
enabled = true
style = "aligned"
