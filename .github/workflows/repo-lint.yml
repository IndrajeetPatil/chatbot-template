name: Repository Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Force colour in non-TTY Actions logs; retain warnings and errors.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_COLOR: always
  UV_NO_PROGRESS: "1"

jobs:
  repo-lint:
    name: Spelling, workflows, and links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Markdown lint
        run: make markdown-lint

      - name: Spelling (typos)
        run: make spell-check

      # The runner's shellcheck also checks the shell in every `run:` block.
      - name: Workflow lint (actionlint)
        run: make workflow-lint

      # Reads lychee.toml from the repository root.
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress .
          fail: true
          jobSummary: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
