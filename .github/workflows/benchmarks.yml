name: Benchmarks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force colour in non-TTY Actions logs; retain warnings and errors.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_COLOR: always
  UV_NO_PROGRESS: "1"
  PYTEST_ADDOPTS: "-q --color=yes"

jobs:
  backend:
    name: Run backend CodSpeed benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # CodSpeed requests a short-lived OIDC upload token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: ./backend

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv python install
          uv sync --frozen

      - name: Run benchmarks and upload results
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: make backend-benchmark

  frontend:
    name: Run frontend CodSpeed benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # CodSpeed requests a short-lived OIDC upload token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: ./frontend
          node-version-file: .node-version
          # Needs exact versions: Vite+ from the catalog, Node from .node-version.
          cache-toolchain: true
          cache: true
          run-install: false

      # Benchmarks run in Node, so no Playwright browser is needed.
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: vp install --frozen-lockfile -- --loglevel=warn

      - name: Run benchmarks and upload results
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: make frontend-bench
