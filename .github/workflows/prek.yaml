name: prek

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install ls-lint v2.3.1
        run: |
          curl -fsSLO "https://github.com/loeffel-io/ls-lint/releases/download/v2.3.1/ls-lint-linux-amd64"
          echo "b5a0d2e4427ad039fbc574551f17679f38f142b25d15e0e538769f8cf15af397  ls-lint-linux-amd64" | sha256sum -c
          chmod +x ls-lint-linux-amd64
          sudo mv ls-lint-linux-amd64 /usr/local/bin/ls-lint

      # prek manages Python hook environments; ty's hook supplies its own uv.
      # The action caches those environments and forces coloured output.
      - name: Run pre-commit hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          # Latest version covered by this action revision's SHA256 table.
          prek-version: "0.4.11"
          extra-args: --all-files --stage pre-commit
        env:
          # CI checks main too; this guard is for local commits only.
          SKIP: no-commit-to-branch
