name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Force colour in non-TTY Actions logs; retain warnings and errors.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_COLOR: always
  UV_NO_PROGRESS: "1"

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action hard-codes debug logging. Invoke the same scanner version
      # directly to scan all fetched history, including PRs, without API access.
      - name: Run Gitleaks
        run: make secret-scan-ci

      - name: Upload secret scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results
          path: results.sarif
          retention-days: 14

  workflow-audit:
    name: Workflow Audit (zizmor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run zizmor
        run: uvx zizmor@1.30.1 --color=always .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-audit:
    name: Dependency Audit (vp)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ provisions Node from .node-version and pnpm from packageManager.
      - name: Install Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          working-directory: ./frontend
          node-version-file: .node-version
          run-install: false

      - name: Audit production dependencies
        working-directory: ./frontend
        run: vp pm audit -- --prod

  backend-audit:
    name: Dependency Audit (uv)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: ./backend

      # Runtime dependencies are the merge gate. Development-only advisories
      # remain visible through Dependabot and are triaged separately because
      # they are not deployed with the service.
      - name: Audit locked production dependencies
        working-directory: ./backend
        run: uv audit --locked --no-dev --preview-features audit-command

  checkov:
    name: Infrastructure Scan (Checkov)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: ./backend

      - name: Run Checkov
        run: make security-scan
