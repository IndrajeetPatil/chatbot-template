name: QA Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Force colour in non-TTY Actions logs; retain warnings and errors.
env:
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"
  UV_COLOR: always
  UV_NO_PROGRESS: "1"
  PYTEST_ADDOPTS: "-q --color=yes"

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          working-directory: ./backend

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
          package_json_file: frontend/package.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Install ls-lint
        run: |
          curl -fsSLO "https://github.com/loeffel-io/ls-lint/releases/download/v2.3.1/ls-lint-linux-amd64"
          echo "b5a0d2e4427ad039fbc574551f17679f38f142b25d15e0e538769f8cf15af397  ls-lint-linux-amd64" | sha256sum -c
          chmod +x ls-lint-linux-amd64
          sudo mv ls-lint-linux-amd64 /usr/local/bin/ls-lint

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv python install
          uv sync --frozen

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile --loglevel=warn
          pnpm exec playwright install --with-deps

      # Keep the same gates as make qa, with independently readable step logs.
      - name: File naming
        run: make file-naming

      - name: Backend lint and format
        run: make backend-format backend-lint

      - name: Frontend lint and format
        run: make frontend-format BIOME_ARGS=--colors=force

      - name: Markdown lint
        run: make markdown-lint

      - name: Python and TypeScript types
        run: make type-check

      - name: API schema
        run: make backend-validate-api-schema

      - name: Backend tests and coverage
        run: make backend-test

      - name: Frontend tests and coverage
        run: make frontend-test

      - name: Fallow findings
        id: fallow
        working-directory: ./frontend
        # Keep config validation and the human reporter as the enforcement gate.
        # CI formats are for presentation; do not rely on their exit status.
        run: |
          pnpm exec fallow doctor --quiet
          pnpm exec fallow --quiet --format github-annotations
          pnpm exec fallow --fail-on-issues --quiet --summary

      - name: Fallow summary
        if: ${{ !cancelled() && steps.fallow.outcome != 'skipped' }}
        working-directory: ./frontend
        run: pnpm exec fallow --quiet --format github-summary >> "$GITHUB_STEP_SUMMARY"

      - name: CSS quality
        run: make css-quality

      - name: Build frontend
        run: |
          echo "::group::Production build details"
          trap 'echo "::endgroup::"' EXIT
          make frontend-build

      - name: Contrast in light and dark mode
        run: make frontend-contrast-audit

      - name: Frontend security lint
        run: make frontend-security-lint

      - name: Python and TypeScript type coverage
        run: make type-coverage

      - name: Infrastructure security
        run: make security-scan

      - name: Lighthouse CI (collect)
        working-directory: ./frontend
        run: |
          echo "::group::Lighthouse measurement details"
          trap 'echo "::endgroup::"' EXIT
          pnpm dlx @lhci/cli@0.15.1 collect

      - name: Lighthouse CI (scores)
        working-directory: ./frontend
        run: |
          pnpm exec node -e "
            const fs = require('fs');
            const dir = '.lighthouseci';
            const files = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
            const byUrl = {};
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(dir + '/' + f, 'utf8'));
              (byUrl[r.finalUrl] = byUrl[r.finalUrl] || []).push(r);
            }
            const cats = ['performance','accessibility','best-practices','seo'];
            const U = 32, C = 16;
            const lpad = (s, n) => String(s).padStart(n);
            const rpad = (s, n) => String(s).length >= n ? String(s).slice(0, n-1) + '…' : String(s).padEnd(n);
            console.log('\n' + rpad('URL', U) + cats.map(c => lpad(c, C)).join(''));
            console.log('-'.repeat(U + C * cats.length));
            for (const [url, runs] of Object.entries(byUrl)) {
              const avg = cats.map(c => {
                const scores = runs.map(r => r.categories[c]?.score ?? null).filter(s => s !== null);
                return scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100) : '-';
              });
              const label = url.replace('http://localhost','').replace(/\/$/,'') || '/';
              console.log(rpad(label, U) + avg.map(s => lpad(s, C)).join(''));
            }
            console.log('');
          "

      - name: Lighthouse CI (assert)
        working-directory: ./frontend
        run: pnpm dlx @lhci/cli@0.15.1 assert

      - name: Lighthouse CI (upload)
        working-directory: ./frontend
        run: pnpm dlx @lhci/cli@0.15.1 upload --githubToken="$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-reports
          path: |
            backend/htmlcov
            frontend/coverage
            frontend/playwright-report
