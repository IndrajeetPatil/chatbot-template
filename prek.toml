minimum_prek_version = "0.4.5"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "ef6cf06c079dd6b299dfc720b0f14400c9d168e1" # frozen: v0.17.5

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"
types_or = ["python", "pyi", "jupyter", "markdown"]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "ab1cf61bafdd9b4e6b05fbca83ce77eb9b5bac7e" # frozen: v0.0.103

[[repos.hooks]]
id = "ty"
args = ["--directory=backend", "--isolated"]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "df5a947a3af0dba56640e644c6b9316184749168" # frozen: v0.3.4

[[repos.hooks]]
id = "rumdl"

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "276087d9a4f06398b3e04825487805e2d7375888" # frozen: v1.52.2

# Report rather than silently rewrite; a typo fix is a human decision.
[[repos.hooks]]
id = "typos"
args = ["--force-exclude"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ls-lint"
name = "file naming (ls-lint)"
language = "system"
entry = "make file-naming"
pass_filenames = false
always_run = true

# Mirrors pre-commit-hooks' forbid-submodules without a Python environment.
[[repos.hooks]]
id = "forbid-submodules"
name = "forbid submodules"
language = "fail"
entry = "submodules are not allowed in this repository:"
types = ["directory"]

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
language = "node"
entry = "commitlint --config commitlint.config.mjs --edit"
additional_dependencies = [
  "@commitlint/cli@21.0.2",
  "@commitlint/config-conventional@21.0.2",
]
stages = ["commit-msg"]

[[repos.hooks]]
id = "checkov"
name = "checkov security scan"
language = "system"
entry = "make security-scan"
pass_filenames = false
stages = ["pre-push"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "\\.snap$"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "fix-byte-order-marker"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch=main"]
