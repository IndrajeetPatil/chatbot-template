minimum_prek_version = "0.4.5"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "f368fb366ff7f2f808dd324b83a6d32267799e19" # frozen: v0.17.2

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"
types_or = ["python", "pyi", "jupyter", "markdown"]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "44e0d809f7977451fe65f3697106f594b0a02492" # frozen: v0.0.91

[[repos.hooks]]
id = "ty"
args = ["--directory=backend", "--isolated"]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "03a7d1a4936b5889602852175bca2d39acb3281e" # frozen: v0.3.0

[[repos.hooks]]
id = "rumdl"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ls-lint"
name = "file naming (ls-lint)"
language = "system"
entry = "make file-naming"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "commitlint"
name = "commitlint"
language = "node"
entry = "commitlint --config commitlint.config.mjs --edit"
additional_dependencies = [
  "@commitlint/cli@21.0.2",
  "@commitlint/config-conventional@21.0.2",
]
stages = ["commit-msg"]

[[repos.hooks]]
id = "checkov"
name = "checkov security scan"
language = "system"
entry = "make security-scan"
pass_filenames = false
stages = ["pre-push"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "\\.snap$"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "fix-byte-order-marker"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch=main"]
