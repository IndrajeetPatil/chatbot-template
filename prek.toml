minimum_prek_version = "0.4.5"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "e8f7d69b957a30acb2c875078d5fd012de24b64c"  # frozen: v0.16.7
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format", types_or = ["python", "pyi", "jupyter", "markdown"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "166c7027240501d219155fe71ad9817f8d69237b"  # frozen: v0.0.80
hooks = [
  { id = "ty", args = ["--directory=backend", "--isolated"] },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "5d5d9ecda0a544617f550c84792ea1bd717620e1"  # frozen: v0.2.72
hooks = [
  { id = "rumdl" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ls-lint",
    name = "file naming (ls-lint)",
    language = "system",
    entry = "make file-naming",
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "commitlint",
    name = "commitlint",
    language = "node",
    entry = "commitlint --config commitlint.config.mjs --edit",
    additional_dependencies = [
      "@commitlint/cli@21.0.2",
      "@commitlint/config-conventional@21.0.2",
    ],
    stages = ["commit-msg"],
  },
  {
    id = "checkov",
    name = "checkov security scan",
    language = "system",
    entry = "make security-scan",
    pass_filenames = false,
    stages = ["pre-push"],
  },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "\\.snap$" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-toml" },
  { id = "check-json", exclude = "^\\.vscode/" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]
