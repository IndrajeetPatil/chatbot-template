<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="A minimal full-stack chatbot template built with React and FastAPI."
    />
    <meta
      name="color-scheme"
      content="dark light"
    />
    <meta
      name="theme-color"
      content="#121212"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="48x48"
    />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="/site.webmanifest"
    />
    <title>Chatbot Template</title>
    <script>
      (() => {
        const { hostname } = globalThis.location;
        if (
          hostname === "localhost" ||
          hostname === "127.0.0.1" ||
          hostname === "[::1]"
        ) {
          return;
        }

        const script = document.createElement("script");
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-3BQ49J7KYH";
        script.async = true;
        document.head.append(script);

        function gtag() {
          // Google Analytics processes `arguments` objects, not plain arrays.
          // oxlint-disable-next-line prefer-rest-params
          globalThis.dataLayer?.push(arguments);
        }
        globalThis.dataLayer ??= [];
        globalThis.gtag = gtag;
        gtag("js", new Date());
        gtag("config", "G-3BQ49J7KYH", {
          cookie_flags: "SameSite=Lax;Secure",
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
